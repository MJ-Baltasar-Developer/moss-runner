# Test the Rust engine, build it to WebAssembly, and publish the web folder to GitHub Pages.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # pinned: Playwright's browsers need an Ubuntu release it supports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Check formatting
        run: cargo fmt --check
        working-directory: engine

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: engine

      - name: Tests
        run: cargo test
        working-directory: engine

      - name: Build WebAssembly
        run: ./build.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Browser tests (desktop, phone, tablet, offline)
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m http.server 8000 --directory ../../web >/dev/null 2>&1 &
          sleep 1
          node e2e.mjs http://localhost:8000/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
